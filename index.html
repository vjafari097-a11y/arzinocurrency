<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت لحظه‌ای ارز</title>
<style>
body{font-family:Tahoma;background:#1a1a2e;color:#fff;margin:0;padding:20px}
h1{text-align:center;color:#f9d423}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:900px;margin:20px auto}
.card{background:#16213e;border-radius:12px;padding:15px;text-align:center}
.price{font-size:20px;font-weight:bold;direction:ltr}
.up{color:#00e676}.down{color:#ff5252}
.msg{text-align:center;color:#aaa;padding:20px}
button{display:block;margin:15px auto;padding:10px 25px;border:none;border-radius:20px;background:#f9d423;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>💰 قیمت لحظه‌ای ارز</h1>
<button onclick="loadAll()">🔄 بروزرسانی</button>
<div class="grid" id="box"><div class="msg">در حال بارگذاری...</div></div>
<p class="msg" id="time"></p>
<script>
async function loadAll(){
  var box=document.getElementById('box');
  box.innerHTML='<div class="msg">در حال بارگذاری...</div>';
  try{
    var r1=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd&include_24hr_change=true');
    var d1=await r1.json();
    var r2=await fetch('https://open.er-api.com/v6/latest/USD');
    var d2=await r2.json();
    var html='';
    html+=card('₿','بیت‌کوین',d1.bitcoin.usd,d1.bitcoin.usd_24h_change);
    html+=card('Ξ','اتریوم',d1.ethereum.usd,d1.ethereum.usd_24h_change);
    html+=card('💲','تتر',d1.tether.usd,d1.tether.usd_24h_change);
    html+=card('€','یورو (برابر دلار)',d2.rates.EUR,null);
    html+=card('£','پوند (برابر دلار)',d2.rates.GBP,null);
    html+=card('₺','لیر (برابر دلار)',d2.rates.TRY,null);
    box.innerHTML=html;
    document.getElementById('time').textContent='آخرین بروزرسانی: '+new Date().toLocaleTimeString('fa-IR');
  }catch(e){
    box.innerHTML='<div class="msg">❌ خطا در دریافت قیمت. دکمه بروزرسانی را بزنید.</div>';
  }
}
function card(icon,name,price,change){
  var ch='';
  if(change!==null&&change!==undefined){
    var cls=change>=0?'up':'down';
    ch='<div class="'+cls+'">'+(change>=0?'▲':'▼')+' '+Math.abs(change).toFixed(2)+'%</div>';
  }
  return '<div class="card"><div>'+icon+' '+name+'</div><div class="price">$'+Number(price).toLocaleString('en-US',{maximumFractionDigits:4})+'</div>'+ch+'</div>';
}
loadAll();
setInterval(loadAll,60000);
</script>
</body>
</html>
