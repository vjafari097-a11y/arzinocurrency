<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آرزینو | قیمت لحظه‌ای ارز</title>
<style>
body{font-family:Tahoma;background:#1a1a2e;color:#fff;margin:0;padding:20px}
h1{text-align:center;color:#f9d423;margin-bottom:5px}
#logoBox{font-size:40px;vertical-align:middle;margin-left:8px}
.section{max-width:950px;margin:25px auto 10px;border-right:4px solid #f9d423;padding-right:10px;font-size:18px}
.toman-box{background:#16213e;max-width:460px;margin:15px auto;padding:12px;border-radius:12px;text-align:center;border:1px solid #f9d423}
.toman-box small{color:#aaa;display:block;margin-bottom:8px}
.toman-box input{width:130px;padding:6px;border-radius:8px;border:none;text-align:center;font-size:16px;font-weight:bold}
.toman-box button{padding:6px 12px;border:none;border-radius:8px;background:#f9d423;font-weight:bold;cursor:pointer;margin-right:4px}
#rateBadge{color:#00e676}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;max-width:950px;margin:10px auto}
.card{background:#16213e;border-radius:12px;padding:15px;text-align:center}
.name{color:#ccc;margin-bottom:8px}
.price{font-size:18px;font-weight:bold;direction:ltr}
.toman{color:#f9d423;font-size:14px;margin-top:6px}
.up{color:#00e676}.down{color:#ff5252}
.change{font-size:13px;margin-top:4px;direction:ltr}
.msg{text-align:center;color:#aaa;padding:20px}
.refresh{display:block;margin:15px auto;padding:10px 25px;border:none;border-radius:20px;background:#f9d423;font-weight:bold;cursor:pointer}
.time{text-align:center;color:#888;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<h1><span id="logoBox">💰</span> <span id="siteName">آرزینو</span></h1>

<div class="toman-box">
<small>💵 نرخ دلار به تومان: <b id="rateBadge">...</b></small>
<input type="number" id="tomanInput" value="187500">
<button onclick="setToman()">ثبت دستی</button>
<button onclick="setAuto()">🔄 خودکار</button>
</div>

<button class="refresh" onclick="loadAll()">🔄 بروزرسانی قیمت‌ها</button>

<h2 class="section">🪙 ارزهای دیجیتال</h2>
<div class="grid" id="crypto"><div class="msg">در حال بارگذاری...</div></div>

<h2 class="section">💵 ارزهای فیزیکی</h2>
<div class="grid" id="fiat"><div class="msg">در حال بارگذاری...</div></div>

<p class="time" id="time"></p>

<script>
var SITE_NAME = 'آرزینو | Arzino';
var LOGO = '';
var DEFAULT_TOMAN = 187500;

document.getElementById('siteName').textContent = SITE_NAME;
document.title = SITE_NAME + ' | قیمت لحظه‌ای ارز';
if(LOGO !== ''){
  document.getElementById('logoBox').innerHTML = '<img src="'+LOGO+'" alt="logo" style="width:46px;height:46px;border-radius:12px;vertical-align:middle">';
}

var TOMAN = Number(localStorage.getItem('tomanRate')) || DEFAULT_TOMAN;
var mode = localStorage.getItem('tomanMode') || 'auto';

function badge(t){ document.getElementById('rateBadge').textContent = t; }

function parseToman(j, src){
  try{
    if(src.indexOf('bonbast') !== -1){
      if(j && j.usd && j.usd.sell){ return Number(String(j.usd.sell).replace(/,/g,'')); }
      if(j && j.usd && j.usd.buy){ return Number(String(j.usd.buy).replace(/,/g,'')); }
    }else{
      if(j && j.data){
        if(j.data.usd && j.data.usd.price){ return Number(j.data.usd.price); }
        if(j.data.price){ return Number(j.data.price); }
        if(Array.isArray(j.data) && j.data[0] && j.data[0].price){ return Number(j.data[0].price); }
      }
    }
  }catch(e){}
  return 0;
}

async function fetchAutoToman(){
  var sources = [
    'https://bonbast.com/json/',
    'https://api.tgju.org/v1/market/indicator/summary-parameter-data?name=usd'
  ];
  var proxies = [
    function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function(u){ return 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u); }
    ];
  for(var s=0;s<sources.length;s++){
    for(var p=0;p<proxies.length;p++){
      try{
        var r = await fetch(proxies[p](sources[s]));
        var j = await r.json();
        var v = parseToman(j, sources[s]);
        if(v > 1000){ return v; }
      }catch(e){}
    }
  }
  return 0;
}

async function initToman(){
  if(mode === 'auto'){
    badge('⏳ در حال دریافت خودکار...');
    var a = await fetchAutoToman();
    if(a > 1000){
      TOMAN = a;
      badge('🟢 خودکار: ' + a.toLocaleString('fa-IR') + ' تومان');
    }else{
      badge('🟡 دستی (منبع خودکار در دسترس نیست)');
    }
  }else{
    badge('🟡 دستی');
  }
  document.getElementById('tomanInput').value = TOMAN;
  loadAll();
}

function setToman(){
  var v = Number(document.getElementById('tomanInput').value);
  if(v > 0){
    TOMAN = v;
    mode = 'manual';
    localStorage.setItem('tomanRate', v);
    localStorage.setItem('tomanMode', 'manual');
    badge('🟡 دستی');
    loadAll();
  }
}

function setAuto(){
  mode = 'auto';
  localStorage.setItem('tomanMode', 'auto');
  localStorage.removeItem('tomanRate');
  initToman();
}

function toman(usd){
  return Math.round(usd * TOMAN).toLocaleString('fa-IR') + ' تومان';
}

var CRYPTOS = [
['bitcoin','₿','بیت‌کوین'],
['ethereum','Ξ','اتریوم'],
['tether','💲','تتر'],
['binancecoin','🔶','بایننس کوین'],
['solana','◎','سولانا'],
['ripple','✕','ریپل'],
['dogecoin','🐕','دوج‌کوین'],
['tron','🔴','ترون']
];

var FIATS = [
['EUR','€','یورو'],
['GBP','£','پوند انگلیس'],
['TRY','₺','لیر ترکیه'],
['AED','درهم','درهم امارات'],
['CHF','فرانک','فرانک سوئیس'],
['CNY','¥','یوان چین'],
['RUB','₽','روبل روسیه'],
['INR','₹','روپیه هند'],
['JPY','ین','ین ژاپن'],
['CAD','$','دلار کانادا'],
['AUD','$','دلار استرالیا']
];

function card(icon,name,usd,change){
  var ch='';
  if(change!==null && change!==undefined){
    var cls = change>=0 ? 'up':'down';
    ch='<div class="change '+cls+'">'+(change>=0?'▲':'▼')+' '+Math.abs(change).toFixed(2)+'%</div>';
  }
  return '<div class="card"><div class="name">'+icon+' '+name+'</div><div class="price">$'+Number(usd).toLocaleString('en-US',{maximumFractionDigits:4})+'</div><div class="toman">'+toman(usd)+'</div>'+ch+'</div>';
}

function fiatCard(icon,name,ratePerUsd){
  var usd = 1/ratePerUsd;
  return '<div class="card"><div class="name">'+icon+' '+name+'</div><div class="price">$'+usd.toFixed(4)+'</div><div class="toman">'+toman(usd)+'</div></div>';
}

async function loadAll(){
  var cbox=document.getElementById('crypto');
  var fbox=document.getElementById('fiat');
  cbox.innerHTML='<div class="msg">در حال بارگذاری...</div>';
  fbox.innerHTML='<div class="msg">در حال بارگذاری...</div>';
  try{
    var ids = CRYPTOS.map(function(c){return c[0];}).join(',');
    var r1 = await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true');
    var d1 = await r1.json();
    var r2 = await fetch('https://open.er-api.com/v6/latest/USD');
    var d2 = await r2.json();
    var h='';
    for(var i=0;i<CRYPTOS.length;i++){
      var c=CRYPTOS[i];
      var info=d1[c[0]];
      if(info){ h+=card(c[1],c[2],info.usd,info.usd_24h_change); }
    }
    cbox.innerHTML=h;
    var fh=fiatCard('💵','دلار آمریکا',1);
    for(var j=0;j<FIATS.length;j++){
      var f=FIATS[j];
      if(d2.rates[f[0]]){ fh+=fiatCard(f[1],f[2],d2.rates[f[0]]); }
    }
    fbox.innerHTML=fh;
    document.getElementById('time').textContent='آخرین بروزرسانی: '+new Date().toLocaleTimeString('fa-IR');
  }catch(e){
    cbox.innerHTML='<div class="msg">❌ خطا در دریافت قیمت. دکمه بروزرسانی را بزنید.</div>';
    fbox.innerHTML='';
  }
}

initToman();
setInterval(loadAll, 60000);
</script>
</body>
</html>
