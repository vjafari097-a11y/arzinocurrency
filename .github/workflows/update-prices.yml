name: update-prices

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Prepare
      # ==========================================

      - name: Prepare data folder
        run: |
          mkdir -p data

          echo "{}" > data/navasan.json
          echo "{}" > data/nobitex.json
          echo "{}" > data/crypto.json

          echo "Data folder ready."


      # ==========================================
      # 3. تست اتصال اینترنت و DNS
      # ==========================================

      - name: Test connections
        run: |

          echo "================================"
          echo "TESTING CONNECTIONS"
          echo "================================"

          echo ""
          echo "Testing GitHub..."
          curl -I --connect-timeout 10 \
            https://github.com \
            || true

          echo ""
          echo "Testing Nobitex..."
          curl -I --connect-timeout 10 \
            https://api.nobitex.ir \
            || true

          echo ""
          echo "Testing CoinGecko..."
          curl -I --connect-timeout 10 \
            https://api.coingecko.com \
            || true

          echo ""
          echo "Testing Navasan..."
          curl -I --connect-timeout 10 \
            http://api.navasan.tech \
            || true

          echo ""
          echo "Connection test finished."


      # ==========================================
      # 4. Navasan
      # منبع فعلی ارز و طلا
      # ==========================================

      - name: Fetch Navasan
        run: |

          echo "Fetching Navasan..."

          curl -L -sS \
            --connect-timeout 15 \
            --max-time 40 \
            "http://api.navasan.tech/latest/?api_key=freeqNwteMeqD7BsSJ93t0MQ9k4wtcUZ" \
            -o data/navasan.json

          if [ ! -s data/navasan.json ]; then
            echo "{}" > data/navasan.json
          fi

          echo "Navasan result:"
          head -c 500 data/navasan.json || true

          echo ""


      # ==========================================
      # 5. Nobitex
      # منبع اول کریپتو
      # ==========================================

      - name: Fetch Nobitex
        run: |

          echo "Fetching Nobitex..."

          curl -L -sS \
            --connect-timeout 15 \
            --max-time 40 \
            "https://api.nobitex.ir/market/stats?srcCurrency=btc,eth,usdt,bnb,sol,xrp,doge,trx,ada,link,dot,ltc,avax,near,uni,xlm&dstCurrency=rls" \
            -o data/nobitex.json

          if [ ! -s data/nobitex.json ]; then
            echo "{}" > data/nobitex.json
          fi

          echo "Nobitex result:"
          head -c 1000 data/nobitex.json || true

          echo ""


      # ==========================================
      # 6. CoinGecko
      # منبع دوم / پشتیبان کریپتو
      # ==========================================

      - name: Fetch CoinGecko
        run: |

          echo "Fetching CoinGecko..."

          curl -L -sS \
            -A "Mozilla/5.0" \
            --connect-timeout 15 \
            --max-time 40 \
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,binancecoin,solana,ripple,dogecoin,tron,cardano,avalanche-2,chainlink,polkadot,litecoin,near,uniswap,stellar&vs_currencies=usd&include_24hr_change=true" \
            -o data/crypto.json

          if [ ! -s data/crypto.json ]; then
            echo "{}" > data/crypto.json
          fi

          echo "CoinGecko result:"
          head -c 500 data/crypto.json || true

          echo ""


      # ==========================================
      # 7. فلزات جهانی
      # ==========================================

      - name: Fetch metals
        run: |
echo "Fetching metals..."

          for metal in XAU XAG XPT XPD
          do

            lower=$(echo "$metal" | tr '[:upper:]' '[:lower:]')

            echo "Fetching $metal..."

            curl -L -sS \
              --connect-timeout 15 \
              --max-time 30 \
              "https://api.gold-api.com/price/$metal" \
              -o "data/$lower.json" \
              || true

            if [ ! -s "data/$lower.json" ]; then
              echo "{}" > "data/$lower.json"
            fi

          done

          echo "Metals completed."


      # ==========================================
      # 8. نمایش فایل‌ها
      # ==========================================

      - name: Check data
        run: |

          echo "================================"
          echo "DATA FILES"
          echo "================================"

          ls -lah data/

          echo ""
          echo "Navasan:"
          head -c 300 data/navasan.json || true

          echo ""
          echo ""
          echo "Nobitex:"
          head -c 500 data/nobitex.json || true

          echo ""
          echo ""
          echo "CoinGecko:"
          head -c 300 data/crypto.json || true

          echo ""
          echo ""
          echo "================================"


      # ==========================================
      # 9. Commit & Push
      # ==========================================

      - name: Commit and push
        run: |

          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"

          git add data/

          if git diff --staged --quiet
          then
            echo "No changes detected"
          else
            git commit \
              -m "update prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            git push
          fi
          
