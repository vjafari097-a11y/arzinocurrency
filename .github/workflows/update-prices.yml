name: update-prices

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. ساخت پوشه data
      # ==========================================

      - name: Prepare data
        run: |
          mkdir -p data

          echo "{}" > data/navasan.json
          echo "{}" > data/nobitex.json
          echo "{}" > data/crypto.json


      # ==========================================
      # 3. ارز و طلا
      # منبع فعلی پایدار
      # ==========================================

      - name: Fetch Navasan
        run: |

          echo "Fetching Navasan..."

          curl -L -sS \
            --fail \
            --max-time 40 \
            "https://api.navasan.tech/latest/?api_key=freeqNwteMeqD7BsSJ93t0MQ9k4wtcUZ" \
            -o data/navasan.json

          if [ ! -s data/navasan.json ]; then
            echo "{}" > data/navasan.json
          fi

          echo "Navasan OK."


      # ==========================================
      # 4. کریپتو
      # منبع اول: Nobitex
      # ==========================================

      - name: Fetch Nobitex
        run: |

          echo "Fetching Nobitex..."

          curl -L -sS \
            --fail \
            --max-time 40 \
            "https://api.nobitex.ir/market/stats?srcCurrency=btc,eth,usdt,bnb,sol,xrp,doge,trx,ada,link,dot,ltc,avax,near,uni,xlm&dstCurrency=rls" \
            -o data/nobitex.json

          if [ ! -s data/nobitex.json ]; then
            echo "{}" > data/nobitex.json
          fi

          echo "Nobitex OK."

          echo "Nobitex response:"
          head -c 500 data/nobitex.json || true
          echo


      # ==========================================
      # 5. کریپتو
      # منبع دوم: CoinGecko
      # ==========================================

      - name: Fetch CoinGecko backup
        run: |

          echo "Fetching CoinGecko..."

          curl -L -sS \
            --fail \
            -A "Mozilla/5.0" \
            --max-time 40 \
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether,binancecoin,solana,ripple,dogecoin,tron,cardano,avalanche-2,chainlink,polkadot,litecoin,near,uniswap,stellar&vs_currencies=usd&include_24hr_change=true" \
            -o data/crypto.json

          if [ ! -s data/crypto.json ]; then
            echo "{}" > data/crypto.json
          fi

          echo "CoinGecko OK."


      # ==========================================
      # 6. فلزات جهانی
      # ==========================================

      - name: Fetch metals
        run: |

          echo "Fetching metals..."

          for metal in XAU XAG XPT XPD; do

            lower=$(echo "$metal" | tr '[:upper:]' '[:lower:]')

            curl -L -sS \
              --max-time 30 \
              "https://api.gold-api.com/price/$metal" \
              -o "data/$lower.json" || true

            if [ ! -s "data/$lower.json" ]; then
              echo "{}" > "data/$lower.json"
            fi

          done

          echo "Metals completed."


      # ==========================================
      # 7. بررسی فایل‌ها
      # ==========================================

      - name: Check data
        run: |

          echo "=============================="
          echo "DATA FILES"
          echo "=============================="

          ls -lah data/

          echo
          echo "Navasan:"
          head -c 300 data/navasan.json || true

          echo
          echo
          echo "Nobitex:"
          head -c 500 data/nobitex.json || true

          echo
          echo
          echo "CoinGecko:"
          head -c 300 data/crypto.json || true

          echo
          echo
          echo "=============================="
# ==========================================
      # 8. Commit و Push
      # ==========================================

      - name: Commit and push
        run: |

          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"

          git add data/

          if git diff --staged --quiet; then

            echo "No changes detected"

          else

            git commit \
              -m "update prices $(date -u +%Y-%m-%dT%H:%M:%SZ)"

            git push

          fi          
